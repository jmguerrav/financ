/* ============ iPhone preview — clean device mockup, skin-aware (uses live --bg/--card/--ink) ============ */
body.phone{background:radial-gradient(135% 108% at 50% -8%,#2c2d33 0%,#0a0a0c 64%);overflow-x:hidden}
/* device bezel */
body.phone::before{content:"";position:fixed;left:50%;top:14px;bottom:14px;width:408px;transform:translateX(-50%);border:13px solid #08080a;border-radius:56px;pointer-events:none;z-index:60;box-shadow:0 46px 110px rgba(0,0,0,.62),inset 0 0 0 2px rgba(255,255,255,.05)}

body.phone::after{content:"";position:fixed;left:50%;top:27px;bottom:27px;width:382px;transform:translateX(-50%);background:var(--bg);border-radius:44px;z-index:-1}
body.phone .topbar,body.phone .tabbar{position:fixed;left:50%;transform:translateX(-50%);width:382px;max-width:382px}
/* header + notch */
body.phone .topbar{top:27px;z-index:58;background:var(--bg)!important;border:0!important;border-bottom:1px solid var(--hair)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;overflow:visible;border-radius:44px 44px 0 0;padding-top:36px}
body.phone .topbar .wrap{flex-wrap:wrap;height:auto;min-height:auto;padding:0 18px 12px;row-gap:9px;gap:6px}
body.phone .topbar::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:118px;height:26px;background:#08080a;border-radius:16px;z-index:61}

/* tabbar + home indicator */

/* ===== REAL phone (narrow viewport): keep all the mobile styling above, but drop the fake device bezel and go edge-to-edge, safe-area aware ===== */

/* ===================================================================
   LIQUID GLASS — Rev 2 (iOS 26 aesthetic). CSS-only layer; JS untouched.
   Frosted translucent surfaces over a vibrant fixed mesh background.
   =================================================================== */
html,body{background-attachment:fixed}
body{min-height:100vh}
::selection{background:rgba(10,132,255,.22)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.34);border-radius:999px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
html.dark ::-webkit-scrollbar-thumb{background:rgba(235,235,245,.22);background-clip:content-box}

/* --- frosted top bar --- */
.topbar{background:rgba(255,255,255,.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glassbrd)}
html.dark .topbar{background:rgba(18,18,24,.5)}
body.hasbg .topbar{background:rgba(255,255,255,.4);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
html.dark body.hasbg .topbar{background:rgba(18,18,24,.42)}
.brand{font-size:20px}

/* --- floating glass tab bar (centered pill) --- */
.tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:16px;width:auto;max-width:none;border-radius:28px;border:1px solid var(--glassbrd);background:var(--glass);backdrop-filter:saturate(180%) blur(34px);-webkit-backdrop-filter:saturate(180%) blur(34px);box-shadow:var(--shadow),var(--glasshi);overflow:hidden;padding-bottom:0}
.tabbar .wrap{width:auto;max-width:none;justify-content:center;gap:2px;height:60px;padding:0 10px}
.tab{flex:0 0 auto;padding:0 17px;border-radius:18px;transition:color .18s ease}
.tab.on{color:var(--blue)}
body.phone .tabbar{border-radius:28px}
#ver{bottom:88px}

/* --- glass cards / KPIs / account cards --- */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassbrd);border-radius:24px;box-shadow:var(--shadow),var(--glasshi)}
.acctcard{background:var(--glass2)}
.flipback{background:#111;border-color:#111;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
/* keep filled KPI tiles vivid + add a top gloss line */
.kpi.danger,.kpi.good,.kpi.zero,.kpi.cblue,.kpi.kpaid,.kpi.acctfill{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.2)}
.kpi .val{font-size:28px}
.kpi .lbl{letter-spacing:.05em}

/* --- typography lift --- */
.title{font-size:34px;letter-spacing:-.035em}
.cardhead h3{font-size:20px;letter-spacing:-.02em}
.sheet h3{font-size:21px;letter-spacing:-.02em}

/* --- glass pills: buttons, nav, segmented, chips --- */
.tbtn,.mnav,.seg2,.yearnav button{background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassbrd)}
.tbtn.on{background:var(--ink);color:var(--card);border-color:transparent}
.chip{background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassbrd)}
.chip.on{background:var(--ink);color:var(--card);border-color:transparent}
.seg button.on{background:var(--glass2);box-shadow:var(--glasshi),0 1px 3px rgba(0,0,0,.12)}
html.dark .seg button.on{background:var(--glass2)}
.mpcell{background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassbrd);border-radius:14px}
.mpcell.on{background:var(--ink);color:var(--card);border-color:transparent}

/* --- inputs with Apple focus ring --- */
.field input,.field select,.editrow input.amt,.logrow input{background:var(--glass2);border:1px solid var(--glassbrd);border-radius:13px}
.field input:focus,.field select:focus,.editrow input.amt:focus,.logrow input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.18)}

/* --- buttons: Apple-blue primary --- */
.btn{border-radius:15px}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassbrd)}

/* --- floating action buttons --- */
.fab{box-shadow:0 10px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.16)}
.fabmini{background:var(--glass2);color:var(--ink);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassbrd);box-shadow:var(--shadow)}
.fabmini svg{stroke:var(--ink)}

/* --- bottom-sheet modal: glass + grab handle --- */
.scrim{background:rgba(0,0,0,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:var(--glass2);backdrop-filter:saturate(180%) blur(40px);-webkit-backdrop-filter:saturate(180%) blur(40px);border:1px solid var(--glassbrd);border-bottom:0;border-radius:28px 28px 0 0}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--track);margin:-6px auto 14px}

/* --- progress tracks slightly inset --- */
.track,.spentrow .sb{box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}

/* --- spreadsheet card: round + clip onto the glass --- */
.pcard{border-radius:18px;border:1px solid var(--glassbrd)}
.tablewrap.fitwrap{border-radius:17px}

/* --- AI panel as glass --- */
#fbai-panel{background:var(--glass2);backdrop-filter:saturate(180%) blur(34px);-webkit-backdrop-filter:saturate(180%) blur(34px);border:1px solid var(--glassbrd);border-radius:22px;box-shadow:var(--shadow),var(--glasshi)}
.fbai-head{border-bottom:1px solid var(--glassbrd)}
.fbai-foot{border-top:1px solid var(--glassbrd)}
.fbai-bot{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#fbai-fab{box-shadow:0 8px 24px rgba(10,132,255,.42),inset 0 1px 0 rgba(255,255,255,.3)}
.fbai-foot textarea{background:var(--glass2);border:1px solid var(--glassbrd)}

/* ================= REV 4 — Fintech dashboard skin ================= */
:root{--bg:linear-gradient(180deg,#eef1f7 0%,#e8ecf3 100%);--card:#ffffff;--ink:#181a2a;--sub:#8a90a6;--hair:rgba(24,26,42,.08);--track:rgba(24,26,42,.07);--blue:#4353ff;--violet:#7c5cff;--green:#16b364;--red:#f0384f;--shadow:0 1px 2px rgba(20,24,60,.05),0 10px 30px rgba(20,24,60,.06);--glass:#ffffff;--glass2:#ffffff;--glassbrd:rgba(24,26,42,.07);--glasshi:0 0 rgba(0,0,0,0);--blur:saturate(105%) blur(0px)}
html.dark{--bg:linear-gradient(180deg,#14161f 0%,#0d0e15 100%);--card:#1c1f2b;--ink:#edeff5;--sub:#9096a8;--hair:rgba(255,255,255,.07);--track:rgba(255,255,255,.09);--glass:#1c1f2b;--glass2:#1c1f2b;--glassbrd:rgba(255,255,255,.08);--glasshi:0 0 rgba(0,0,0,0);--shadow:0 1px 2px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.45);--blue:#6473ff;--green:#35c47c;--red:#ef5d6d;--violet:#a184ff}
/* night: softer, richer surfaces + a deep (not blinding) hero */
html.dark .hero{background:linear-gradient(120deg,#2b2f66 0%,#362d63 52%,#3f2b5e 100%)!important;box-shadow:0 16px 44px rgba(0,0,0,.5)}
html.dark .hero:before,html.dark .hero:after{opacity:.5}
html.dark .card{border:1px solid rgba(255,255,255,.06)}
html.dark .kpi.danger .val{color:#ef7c88}html.dark .kpi.good .val,html.dark .kpi.zero .val{color:#4fd08e}html.dark .kpi.cblue .val{color:#8b96ff}
html.dark .acctcard .pd.due{color:#ef7c88}html.dark .acctcard .pd.paid{color:#4fd08e}

/* Sidebar */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--card);border-right:1px solid var(--hair);display:none;flex-direction:column;padding:22px 16px;z-index:45}
.sbrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink);padding:2px 6px 22px}
.sbmark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#7c5cff);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sbmark svg{width:16px;height:16px}
.sbnav{display:flex;flex-direction:column;gap:4px;flex:1}
#sidebar .navitem{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;width:100%;height:auto;padding:11px 12px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:14.5px;font-weight:600;color:var(--sub);cursor:pointer;text-align:left}
#sidebar .navitem svg{width:20px;height:20px;flex:none}
#sidebar .navitem span{font-size:14.5px;font-weight:600}
#sidebar .navitem.on{background:var(--blue);color:#fff;box-shadow:0 10px 20px rgba(67,83,255,.28)}
#sidebar .navitem:not(.on):hover{background:rgba(67,83,255,.08);color:var(--ink)}
.sbbottom{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair);padding-top:10px;margin-top:10px}

/* Desktop layout: sidebar replaces bottom tabs */
@media(min-width:900px){
  html,body{height:100%;overflow:hidden}
  body:not(.phone){padding-left:236px;padding-bottom:0}
  body:not(.phone) #sidebar{display:flex}
  body:not(.phone) .tabbar{display:none}
  body:not(.phone) .topbar #brand{display:none}
  body:not(.phone) #ver{display:none}
  body:not(.phone) .topbar{position:fixed;top:0;left:236px;right:0;z-index:30}
  body:not(.phone) #app{position:relative;height:calc(100vh - 54px);margin-top:54px;overflow-y:auto;overflow-x:hidden;padding-bottom:22px}
  /* AI docked as an always-open right column */
  body:not(.phone) #fbai-fab{display:none!important}
  body:not(.phone) #fbai-panel{left:auto;right:0;top:0;bottom:0;width:384px;max-width:384px;height:100vh;border-radius:0;border:0;border-left:1px solid var(--hair);box-shadow:-10px 0 44px rgba(20,24,60,.14)}
  body:not(.phone) #fbai-panel .fbai-x{display:block}
  .topbar .fabmini,.topbar #fab{position:static;width:32px;height:32px;min-width:32px;border-radius:999px;box-shadow:none;margin:0;background:#e9e9ec;color:var(--ink);font-size:19px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:0}
  .topbar .fabmini svg,.topbar #fab svg{width:16px;height:16px}
  .topbar #fab{background:var(--blue);color:#fff;font-size:20px;font-weight:700;display:none}
  .topbar #fab.show{display:inline-flex}
  html.dark .topbar .fabmini{background:#2a2a30}
  /* Summary: compact to fit one screen */
  body:not(.phone) #app .hero{padding:17px 24px;margin:12px 0 12px}
  body:not(.phone) #app .hero-h{font-size:23px;margin:3px 0 6px}
  body:not(.phone) #app .hero-cta{margin-top:11px;padding:8px 15px}
  body:not(.phone) #app .grid{gap:11px}
  body:not(.phone) #app .filters{margin-bottom:10px}
  body:not(.phone) #app .kpi{padding:12px 14px}
  body:not(.phone) #app .kpi .val{font-size:19px;margin-top:3px}
  body:not(.phone) #app .kpi .cap{margin-top:3px}
  body:not(.phone) #app .acctcard .glass{height:46px}
  body:not(.phone) #app .cards3{margin-top:11px!important}
  body:not(.phone) #app .title{font-size:22px}
  body:not(.phone) #app .cards3 ~ .card{display:none}
  /* thin, unobtrusive scrollbars inside windows */
  body:not(.phone) #app::-webkit-scrollbar,#fbai-log::-webkit-scrollbar,.tablewrap::-webkit-scrollbar{width:8px;height:8px}
  body:not(.phone) #app::-webkit-scrollbar-thumb,#fbai-log::-webkit-scrollbar-thumb,.tablewrap::-webkit-scrollbar-thumb{background:rgba(120,120,140,.28);border-radius:8px}
  body:not(.phone) #app::-webkit-scrollbar-track,.tablewrap::-webkit-scrollbar-track{background:transparent}
}

/* Topbar */
.topbar{background:rgba(238,241,247,.82)!important;border-bottom:1px solid var(--hair)!important}
html.dark .topbar{background:rgba(18,20,29,.82)!important}
.tbtn{background:var(--card);border:1px solid var(--hair)}
.tbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mnav{background:var(--card);border:1px solid var(--hair)}

/* Cards */
.card{border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow)}
.acctcard{border:1px solid var(--hair)!important}

/* KPI -> white stat cards */
.kpi{position:relative}
.kpi.danger,.kpi.good,.kpi.cblue,.kpi.zero,.kpi.acctfill{background:var(--card)!important;border:1px solid var(--hair)!important;box-shadow:var(--shadow)!important}
.kpi .lbl,.kpi.zero .lbl{color:var(--sub)!important}
.kpi .cap,.kpi.zero .cap{color:var(--sub)!important}
.kpi.danger .val{color:var(--red)!important}
.kpi.good .val,.kpi.zero .val{color:var(--green)!important}
.kpi.cblue .val{color:var(--blue)!important}

/* Budget tiles */
.glass.g0{background:var(--blue)!important;border-color:var(--blue)!important}
.glass.over{background:var(--red)!important;border-color:var(--red)!important}

/* Accent controls */
.btn.primary{background:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fab{background:var(--blue);box-shadow:0 12px 28px rgba(67,83,255,.4)}
.tab.on{color:var(--blue)}
#fbai-fab{background:var(--blue)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 30px;margin:18px 0 20px;background:linear-gradient(115deg,#3f46ff 0%,#5b3dff 52%,#7a34ff 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 18px 42px rgba(67,83,255,.32)}
.hero:before{content:"";position:absolute;right:-30px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:after{content:"";position:absolute;right:90px;bottom:-100px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-txt{position:relative;z-index:1}
.hero-eye{font-size:13px;font-weight:600;opacity:.85;text-transform:capitalize}
.hero .hero-h{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:5px 0 9px;color:#fff}
.hero-sub{font-size:14px;opacity:.94}.hero-sub b{font-weight:800}
.hero-cta{margin-top:17px;border:0;background:#fff;color:var(--blue);font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:12px;cursor:pointer}
.hero-cta:hover{filter:brightness(.97)}
.hero-art{position:relative;z-index:1}
.hero-mini{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:16px 22px;min-width:180px}
.hm-lbl{display:block;font-size:12px;opacity:.85;font-weight:600}
.hm-val{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:5px;color:#fff}
.hm-cur{font-size:11px;opacity:.82}
@media(max-width:640px){.hero-art{display:none}.hero{padding:22px}.hero .hero-h{font-size:24px}}
/* Settings as a centered modal (dimmed backdrop) */
.sheet.centered{top:50%;left:50%;right:auto;bottom:auto;margin:0;transform:translate(-50%,-50%) scale(.96);opacity:0;border-radius:22px!important;max-width:560px;width:min(560px,calc(100vw - 40px));max-height:84vh;padding:22px 22px 24px;box-shadow:0 24px 70px rgba(10,12,40,.34);transition:transform .2s ease,opacity .2s ease}
/* Claude-style settings modal: left section nav + right content */
.sheet.ajmodal{max-width:820px;width:min(820px,calc(100vw - 40px));height:min(620px,86vh);max-height:86vh;padding:0;overflow:hidden}
.ajwrap{display:flex;height:100%}
.ajnav{width:210px;flex:none;background:var(--srf2,var(--track));border-right:1px solid var(--hair);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ajnav-h{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);padding:4px 12px 10px}

/* ================= SKINS — variable remap layers (declared LAST so they win the cascade). One DOM, two variable layers per skin; Día/Noche = html.dark inside each. ================= */
/* --- Codex: pure monochrome. Day = white w/ black accent; Night = black w/ white accent; on-accent text inverts per variant. --- */
html.style-cdx{--bg:#F7F7F5;--card:#FFFFFF;--srf2:#F1F1EF;--ink:#1A1A1A;--sub:rgba(26,26,26,.52);--hair:rgba(0,0,0,.07);--hair2:rgba(0,0,0,.14);--track:rgba(0,0,0,.07);--blue:#1A1A1A;--onacc:#FFFFFF;--green:#3d3d3d;--red:#666666;--violet:#4a4a4a;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.05);--glass:#FFFFFF;--glass2:#F1F1EF;--glassbrd:rgba(0,0,0,.07);--glasshi:0 0 rgba(0,0,0,0);--blur:none}
html.style-cdx.dark{--bg:#0E0E0E;--card:#161616;--srf2:#1E1E1E;--ink:#F2F2F2;--sub:rgba(242,242,242,.52);--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.16);--track:rgba(255,255,255,.10);--blue:#F2F2F2;--onacc:#0E0E0E;--green:#d4d4d4;--red:#9e9e9e;--violet:#bdbdbd;--shadow:0 1px 2px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.55);--glass:#161616;--glass2:#1E1E1E;--glassbrd:rgba(255,255,255,.08)}
/* --- Linear: indigo #5E6AD2 accent on near-mono surfaces, day + night. --- */
html.style-lin{--bg:#F9F9FB;--card:#FFFFFF;--srf2:#F1F2F4;--ink:#282A30;--sub:#6B6F76;--hair:rgba(0,0,0,.07);--hair2:rgba(0,0,0,.12);--track:rgba(0,0,0,.06);--blue:#5E6AD2;--onacc:#FFFFFF;--green:#26A968;--red:#E5484D;--violet:#8E6BE8;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);--glass:#FFFFFF;--glass2:#F7F7F9;--glassbrd:rgba(0,0,0,.07);--glasshi:0 0 rgba(0,0,0,0);--blur:none}
html.style-lin.dark{--bg:#0F1015;--card:#16171D;--srf2:#1D1F26;--ink:#EEEFF1;--sub:#8A8F98;--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.14);--track:rgba(255,255,255,.08);--blue:#5E6AD2;--onacc:#FFFFFF;--green:#4CB782;--red:#EB5757;--violet:#B59AFF;--shadow:0 1px 2px rgba(0,0,0,.45),0 16px 40px rgba(0,0,0,.5);--glass:#16171D;--glass2:#1D1F26;--glassbrd:rgba(255,255,255,.08)}
/* --- Shared component remap for BOTH skins: flat surfaces, hairline borders, accent/on-accent inversion, no glass blur, no brand gradients. --- */
html[class*="style-"] #bglayer,html[class*="style-"] #bgveil{display:none}
html[class*="style-"] #claudebtn,html[class*="style-"] .huewrap,html[class*="style-"] #bgbtn{display:none!important}
html[class*="style-"] .topbar{background:var(--bg)!important;border-bottom:1px solid var(--hair)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html[class*="style-"] .tbtn{background:var(--card);border:1px solid var(--hair2);color:var(--ink)}
html[class*="style-"] .tbtn.on{background:var(--blue);color:var(--onacc);border-color:var(--blue)}
html[class*="style-"] .mnav{background:var(--card);border:1px solid var(--hair2)}
html[class*="style-"] .mnav button,html[class*="style-"] .mnav .lbl{color:var(--ink)}
html[class*="style-"] .topbar .fabmini{background:var(--card);border:1px solid var(--hair2);color:var(--ink)}
html[class*="style-"] .topbar #fab{background:var(--blue);color:var(--onacc)}
html[class*="style-"] #sidebar{background:var(--card);border-right:1px solid var(--hair)}
html[class*="style-"] .sbrand{color:var(--ink)}
html[class*="style-"] .sbmark{background:var(--blue);color:var(--onacc)}
html[class*="style-"] #sidebar .navitem.on{background:var(--blue);color:var(--onacc);box-shadow:none}
html[class*="style-"] #sidebar .navitem:not(.on):hover{background:var(--track);color:var(--ink)}
html[class*="style-"] .card{background:var(--card);border:1px solid var(--hair);box-shadow:var(--shadow)}
html[class*="style-"] .hero{background:var(--card);border:1px solid var(--hair2);box-shadow:var(--shadow);color:var(--ink)}
html[class*="style-"] .hero:before,html[class*="style-"] .hero:after{display:none}
html[class*="style-"] .hero .hero-h{color:var(--ink)}
html[class*="style-"] .hero-eye,html[class*="style-"] .hero-sub{color:var(--sub);opacity:1}
html[class*="style-"] .hero-cta{background:var(--blue);color:var(--onacc)}
html[class*="style-"] .hero-mini{background:var(--srf2);border:1px solid var(--hair)}
html[class*="style-"] .hm-val{color:var(--ink)}
html[class*="style-"] .hm-lbl,html[class*="style-"] .hm-cur{color:var(--sub);opacity:1}
html[class*="style-"] .chip{background:var(--card);border:1px solid var(--hair2);color:var(--ink)}
html[class*="style-"] .chip.on{background:var(--blue);border-color:var(--blue);color:var(--onacc)}
html[class*="style-"] .chip.ref{color:var(--ink);border-color:var(--hair2)}
html[class*="style-"] .btn.primary{background:var(--blue);color:var(--onacc)}
html[class*="style-"] .btn.ghost{background:var(--srf2);color:var(--ink)}
html[class*="style-"] .btn.danger{background:var(--card);color:var(--ink);border:1px solid var(--hair2)}
html[class*="style-"] .seg{background:var(--srf2)}
html[class*="style-"] .seg button{color:var(--ink)}
html[class*="style-"] .seg button.on{background:var(--blue);color:var(--onacc);box-shadow:none}
html[class*="style-"] .field input,html[class*="style-"] .field select,html[class*="style-"] .editrow input.amt,html[class*="style-"] .logrow input,html[class*="style-"] .fbai-foot textarea,html[class*="style-"] .fbai-head select,html[class*="style-"] .fmi{background:var(--card);border:1px solid var(--hair2);color:var(--ink)}
html[class*="style-"] .sheet{background:var(--card);border:1px solid var(--hair);backdrop-filter:none;-webkit-backdrop-filter:none}
html[class*="style-"] .mpcell{background:var(--card);border-color:var(--hair2);color:var(--ink)}
html[class*="style-"] .mpcell.on{background:var(--blue);color:var(--onacc);border-color:var(--blue)}
html[class*="style-"] .mphead button{background:var(--srf2);color:var(--ink)}
html[class*="style-"] #fbai-fab,html[class*="style-"] .fbai-foot button,html[class*="style-"] .fbai-me{background:var(--blue);color:var(--onacc);box-shadow:var(--shadow)}
html[class*="style-"] #fbai-panel{background:var(--card);border:1px solid var(--hair2);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:var(--shadow)}
html[class*="style-"] .fbai-bot{background:var(--srf2);color:var(--ink);backdrop-filter:none;-webkit-backdrop-filter:none}
html[class*="style-"] .fbai-hint{color:var(--sub)}
html[class*="style-"] .tabbar{background:var(--card);border-color:var(--hair)}
html[class*="style-"] .tab.on{color:var(--ink)}
html[class*="style-"] .checkrow .cb.on{background:var(--blue);border-color:var(--blue);color:var(--onacc)}
html[class*="style-"] .sw{background:var(--track)}
html[class*="style-"] .sw.on{background:var(--blue)}
html[class*="style-"] .sw.on::after{background:var(--onacc)}
html[class*="style-"] .ufchip{background:var(--srf2);border-color:var(--hair2);color:var(--ink)}
html[class*="style-"] table.t td.tot,html[class*="style-"] table.t th.tot,html[class*="style-"] table.t td.apt{background:var(--srf2)}
html[class*="style-"].dark .cbox{background:var(--srf2);border-color:var(--hair2)}
html[class*="style-"] .tip{background:var(--ink);color:var(--bg)}
html[class*="style-"] .glass{background:var(--srf2)}
html[class*="style-"] .glass .glabel{color:var(--ink)}
html[class*="style-"] .glass .glabel small{opacity:.7}
html[class*="style-"] .glass.g0{background:var(--blue)!important;border-color:var(--blue)!important}
html[class*="style-"] .glass.over{background:var(--red)!important;border-color:var(--red)!important}
html[class*="style-"] .glass.g0 .glabel,html[class*="style-"] .glass.over .glabel{color:var(--onacc)}
html[class*="style-"] .glass.gpaid{background:var(--srf2)!important;border-color:var(--hair2)!important}
html[class*="style-"] .glass.gpaid .glabel{color:var(--sub)}
html[class*="style-"] .pd.paid{color:var(--green)}
html[class*="style-"] .pd.due{color:var(--red)}
html[class*="style-"] .estbox{background:var(--srf2);color:var(--ink)}
html[class*="style-"] tr.grouphead .ghd-inc,html[class*="style-"] tr.grouphead .ghd-exp,html[class*="style-"] tr.grouphead .ghd-calc{background:var(--srf2);color:var(--sub)}
html[class*="style-"] td.grt,html[class*="style-"] th.grh{color:var(--ink)}

html[class*="style-"] table.fit tr.cur td.monthcell .cbox.mlabel,html[class*="style-"] tr.cur td.monthcell .cbox.mlabel{background:var(--blue);color:var(--onacc)}
/* --- Linear geometry: crisp small radii + tinted (not filled) active nav, à la Linear. Declared after the shared block so it overrides it. --- */
html.style-lin .card{border-radius:10px}
html.style-lin .tbtn,html.style-lin .chip,html.style-lin .btn,html.style-lin .mnav,html.style-lin .topbar .fabmini,html.style-lin .topbar #fab{border-radius:8px}
html.style-lin .mnav button{border-radius:6px}
html.style-lin .sbmark{border-radius:6px}
html.style-lin #sidebar .navitem{border-radius:7px;padding:9px 10px;font-size:13.5px}
html.style-lin #sidebar .navitem.on{background:rgba(94,106,210,.15);color:#5E6AD2;box-shadow:none}
html.style-lin.dark #sidebar .navitem.on{background:rgba(94,106,210,.22);color:#9BA3E8}
html.style-lin .hero{border-radius:12px}
html.style-lin #fbai-panel{border-radius:12px}
html.style-lin .sheet.centered{border-radius:14px!important}
html.style-lin .seg{border-radius:9px}html.style-lin .seg button{border-radius:7px}

/* --- Financ_ Rev 5: Codex keeps semantic finance colours where state must remain legible. --- */
html.style-cdx #pinbtn.on{background:#111!important;color:#fff!important;border-color:#111!important}
html.style-cdx #pinbtn.on svg{stroke:#fff!important}

/* Current unpaid expenses and the current Due total must read as actionable debt, not neutral grey. */
html.style-cdx table.fit tbody tr.cur td.gcell .cbox.duep,
html.style-cdx table.fit tbody tr.cur td.wcell .cbox.duep,
html.style-cdx table.fit tbody tr.cur td.tot .cbox.cdue{background:#7f1d1d!important;color:#fff!important;border-color:#7f1d1d!important}
html.style-cdx.dark table.fit tbody tr.cur td.gcell .cbox.duep,
html.style-cdx.dark table.fit tbody tr.cur td.wcell .cbox.duep,
html.style-cdx.dark table.fit tbody tr.cur td.tot .cbox.cdue{background:#6f1d1b!important;color:#fff!important;border-color:#9f3a36!important}

/* Savings and Personal are the green inputs in the current-month sheet. */
html.style-cdx table.fit tbody tr.cur td.inccol input.cell[data-id="savings"],
html.style-cdx table.fit tbody tr.cur td.inccol input.cell[data-id="personal"],
html.style-cdx table.fit tbody tr.cur td.tot .cbox.csav{background:#174d2b!important;color:#fff!important;border-color:#174d2b!important}
html.style-cdx.dark table.fit tbody tr.cur td.inccol input.cell[data-id="savings"],
html.style-cdx.dark table.fit tbody tr.cur td.inccol input.cell[data-id="personal"],
html.style-cdx.dark table.fit tbody tr.cur td.tot .cbox.csav{background:#123d23!important;color:#fff!important;border-color:#2f7650!important}

/* Summary uses a restrained green family while retaining Codex's flat geometry. */
html.style-cdx .summary-view .hero{background:#245b36;border-color:#245b36;color:#fff}
html.style-cdx .summary-view .hero .hero-h,
html.style-cdx .summary-view .hero .hm-val{color:#fff}
html.style-cdx .summary-view .hero-eye,
html.style-cdx .summary-view .hero-sub,
html.style-cdx .summary-view .hero .hm-lbl,
html.style-cdx .summary-view .hero .hm-cur{color:rgba(255,255,255,.78)}
html.style-cdx .summary-view .hero-mini{background:#174d2b;border-color:rgba(255,255,255,.22)}
html.style-cdx .summary-view .summary-kpis .kpi{background:#edf6f0!important;border-color:#c8dfd0!important}
html.style-cdx .summary-view .summary-kpis .kpi:nth-child(n+4){background:#dceee2!important;border-color:#a9cfb5!important}
html.style-cdx .summary-view .summary-kpis .kpi .val{color:#245b36!important}
html.style-cdx.dark .summary-view .hero{background:#174d2b;border-color:#2f7650}
html.style-cdx.dark .summary-view .summary-kpis .kpi{background:#16281d!important;border-color:#294b35!important}
html.style-cdx.dark .summary-view .summary-kpis .kpi:nth-child(n+4){background:#193523!important;border-color:#356044!important}
html.style-cdx.dark .summary-view .summary-kpis .kpi .val{color:#8ed0a3!important}

/* --- Financ_ Rev 6: Codex sheet states matched to the rendered references. --- */
/* Past month labels use exactly the same fill, text and border as the other past-row pills. */
html.style-cdx table.fit tbody tr.past td.monthcell .cbox.mlabel{background:#9a9aa2!important;color:#43434a!important;border-color:#84848c!important}
html.style-cdx.dark table.fit tbody tr.past td.monthcell .cbox.mlabel{background:#2a2a30!important;color:#9a9aa2!important;border-color:#54545c!important}

/* The current month is the selected black/white anchor in both Codex variants. */
html.style-cdx table.fit tbody tr.cur td.monthcell .cbox.mlabel,
html.style-cdx.dark table.fit tbody tr.cur td.monthcell .cbox.mlabel{background:#111!important;color:#fff!important;border-color:#111!important}

/* Current Forecast is a dark-green balance, regardless of its positive/negative helper class. */
html.style-cdx table.fit tbody tr.cur td.tot .cbox.cfore{background:#174d2b!important;color:#fff!important;border-color:#174d2b!important}
html.style-cdx.dark table.fit tbody tr.cur td.tot .cbox.cfore{background:#123d23!important;color:#fff!important;border-color:#2f7650!important}

/* Day-mode group band: Month / Income / Expenses / Calculations. */
html.style-cdx:not(.dark) table.fit thead tr.grouphead th{background:#e4e4e4!important;color:#3f3f3f!important;border-bottom-color:#d4d4d4!important}
html.style-cdx:not(.dark) table.fit thead tr.grouphead th .hsh,
html.style-cdx:not(.dark) table.fit thead tr.grouphead th .hmonth,
html.style-cdx:not(.dark) table.fit thead tr.grouphead th .colname{background:transparent!important;color:#3f3f3f!important;border-color:transparent!important}

/* Rev 15: future values keep their red/green ink but now sit on a matching light tint, so a future month
   reads at a glance like the rest of the sheet (Rev 7 had made them colour-only, with no pill). */
html.style-cdx table.fit tbody tr.fut td.gcell .cbox.duep,
html.style-cdx table.fit tbody tr.fut td.wcell .cbox.duep,
html.style-cdx table.fit tbody tr.fut td.tot .cbox.cdue,
html.style-cdx table.fit tbody tr.fut td.tot .cbox.cfore.neg{background:#f9e3e3!important;color:#8b1e1e!important;border-color:#eecccc!important}
html.style-cdx table.fit tbody tr.fut td.inccol .cbox,
html.style-cdx table.fit tbody tr.fut td.inccol input.cell,
html.style-cdx table.fit tbody tr.fut td.tot .cbox.csav,
html.style-cdx table.fit tbody tr.fut td.tot .cbox.cfore.pos{background:#e4f3e9!important;color:#176b36!important;border-color:#c8e3d2!important}
html.style-cdx.dark table.fit tbody tr.fut td.gcell .cbox.duep,
html.style-cdx.dark table.fit tbody tr.fut td.wcell .cbox.duep,
html.style-cdx.dark table.fit tbody tr.fut td.tot .cbox.cdue,
html.style-cdx.dark table.fit tbody tr.fut td.tot .cbox.cfore.neg{background:#3a2426!important;color:#d77870!important;border-color:#573436!important}
html.style-cdx.dark table.fit tbody tr.fut td.inccol .cbox,
html.style-cdx.dark table.fit tbody tr.fut td.inccol input.cell,
html.style-cdx.dark table.fit tbody tr.fut td.tot .cbox.csav,
html.style-cdx.dark table.fit tbody tr.fut td.tot .cbox.cfore.pos{background:#1f3227!important;color:#78c997!important;border-color:#2f4a39!important}

/* --- Financ_ Rev 7: one neutral scale across the complete column-header row. --- */
html.style-cdx:not(.dark) table.fit thead tr:not(.grouphead) th .hsh{background:#e4e4e4!important;color:#3f3f3f!important;border:1px solid #d4d4d4!important}
html.style-cdx.dark table.fit thead tr:not(.grouphead) th .hsh{background:#2c2c2c!important;color:#d0d0d0!important;border:1px solid #404040!important}
html.style-cdx table.fit thead tr:not(.grouphead) th .hsh .colname{color:inherit!important}

/* Rev 13: the LINKED columns (Chile debts paid from Ireland — Mortgage + Loan 1/2/3) keep a light-blue
   column header instead of the neutral grey, so they read as a set at a glance. Specificity beats both
   the Rev-7 neutral rule above and the injected sheet-style preset, which are !important. */
html.style-cdx:not(.dark) table.fit thead tr:not(.grouphead) th.linkcol .hsh,
html.style-cdx:not(.dark) table.fit thead tr:not(.grouphead) th.mirhead .hsh{background:#d6e6fa!important;color:#22497f!important;border:1px solid #b4cdf0!important}
html.style-cdx.dark table.fit thead tr:not(.grouphead) th.linkcol .hsh,
html.style-cdx.dark table.fit thead tr:not(.grouphead) th.mirhead .hsh{background:#1c3050!important;color:#a8c4ea!important;border:1px solid #2e4870!important}

/* Month spans both header rows, but its pill belongs to the column-header scale. */
html.style-cdx:not(.dark) table.fit thead tr.grouphead th.monthhd .hsh,
html.style-cdx:not(.dark) table.fit thead tr.grouphead th.monthhd .hmonth{background:#e4e4e4!important;color:#3f3f3f!important;border:1px solid #d4d4d4!important}

/* A real unpaid expense from a closed month remains an alert: dark red, never neutral grey. */
html.style-cdx table.fit tbody tr.past td.gcell .cbox.pastdue,
html.style-cdx table.fit tbody tr.past td.wcell .cbox.pastdue{background:#7f1d1d!important;color:#fff!important;border-color:#7f1d1d!important}
html.style-cdx.dark table.fit tbody tr.past td.gcell .cbox.pastdue,
html.style-cdx.dark table.fit tbody tr.past td.wcell .cbox.pastdue{background:#6f1d1b!important;color:#fff!important;border-color:#9f3a36!important}

/* --- Financ_ Rev 11: the grey belongs to the whole header cell, not only its inner pill. --- */
html.style-cdx:not(.dark) table.fit thead,
html.style-cdx:not(.dark) table.fit thead tr,
html.style-cdx:not(.dark) table.fit thead th{background:#e4e4e4!important}
html.style-cdx:not(.dark) table.fit thead th .hsh,
html.style-cdx:not(.dark) table.fit thead th .hmonth{background:#e4e4e4!important;border-color:#e4e4e4!important;box-shadow:none!important}
</style>

  function showProposal(d){
    if(d.reply)add('fbai-bot',d.reply);
    var card=document.createElement('div');card.className='fbai-card';
    var pre=document.createElement('pre');pre.textContent=d.preview||'(no changes)';
    var row=document.createElement('div');row.className='fbai-row';
    var apply=document.createElement('button');apply.className='fbai-apply';apply.textContent='✓ Apply';
    var disc=document.createElement('button');disc.className='fbai-discard';disc.textContent='Discard';
    row.appendChild(apply);row.appendChild(disc);card.appendChild(pre);card.appendChild(row);
    logEl.appendChild(card);logEl.scrollTop=logEl.scrollHeight;
    disc.onclick=function(){row.remove();hint('discarded');};
    apply.onclick=function(){
      apply.disabled=true;disc.disabled=true;apply.textContent='applying…';
      try{save();}catch(e){}                       // flush current state before the server appends
      window.financeAI.apply(d.payload).then(function(res){
        row.remove();reloadAndRender();
        add('fbai-bot','✓ Saved.'+((res.applied&&res.applied.length)?'\n'+res.applied.join('\n'):'')+(res.total_entries!=null?('\n('+res.total_entries+' entries)'):''));
      }).catch(function(e){apply.disabled=false;disc.disabled=false;apply.textContent='✓ Apply';add('fbai-err',String((e&&e.message)||e));});
    };
  }
  function send(){
    var text=(inEl.value||'').trim();if(!text)return;
    if(!window.financeAI){add('fbai-err','Open this from the Financ_ app so the AI bridge is available.');return;}
    add('fbai-me',text);inEl.value='';inEl.style.height='auto';busy(true);
    var thinking=add('fbai-bot',provEl.value==='qwen'?'reading…':'thinking…');
    window.financeAI.chat(text,provEl.value).then(function(d){
      thinking.remove();busy(false);d=d||{};
      if(d.kind==='proposal')return showProposal(d);
      if(d.kind==='error')return add('fbai-err',(d.errors||['could not parse that']).join('\n'));
      if(d.kind==='needs_code')return add('fbai-bot',(d.reply?d.reply+'\n\n':'')+'⚙️ That needs an app code change — switch to Claude/Codex above for guidance, or ask Claude Code in the editor.');
      if(d.kind==='answer')return add('fbai-bot',d.reply+(d.model?('\n\n— '+d.model):''));
      if(d.kind==='chat')return add('fbai-bot',d.reply||'…');
      add('fbai-bot',JSON.stringify(d));
    }).catch(function(e){thinking.remove();busy(false);add('fbai-err',String((e&&e.message)||e));});
  }
  sendEl.onclick=send;
  inEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  inEl.addEventListener('input',function(){inEl.style.height='auto';inEl.style.height=Math.min(inEl.scrollHeight,120)+'px';});
})();
</script>
</body>
</html>
